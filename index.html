<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <title>私人典藏書櫃 v2.0</title>
  <style>
    /* --- 共有樣式 (沿用舊版優良基因) --- */
    body { transition: all 0.4s ease; font-family: 'Noto Sans TC', sans-serif; min-height: 100vh; padding-bottom: 60px; overflow-x: hidden; }
    .header-banner { transition: all 0.4s ease; padding: 25px; border-radius: 0 0 20px 20px; margin-bottom: 20px; }
    #btnGroup .btn { transition: all 0.2s ease; border-width: 2px; font-weight: bold; }
    .book-card-inner { position: relative; border-radius: 12px; transition: all 0.3s ease; height: 100%; cursor: pointer; background: #fff; color: #333; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .book-card-inner:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
    .img-container { position: relative; width: 100%; padding-top: 140%; overflow: hidden; border-radius: 12px 12px 0 0; background: #eee; border-bottom: 1px solid #eee; }
    .cover-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
    .book-title { font-size: 0.85rem; font-weight: 700; text-align: center; padding: 10px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; height: 3.2rem; }

    /* Tooltip 彈出完整標題 */
    .book-card-inner::after {
      content: attr(data-title);
      position: absolute; bottom: 110%; left: 50%; transform: translateX(-50%) translateY(10px);
      width: 220px; padding: 10px; border-radius: 8px; font-size: 0.85rem; text-align: center;
      line-height: 1.4; white-space: normal; z-index: 9999; opacity: 0; visibility: hidden; pointer-events: none; transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); background: #333; color: #fff;
    }
    .book-card-inner:hover::after { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }

    /* --- 分類按鈕樣式修正 --- */
    .btn-xs { padding: .25rem .4rem; font-size: .75rem; border-radius: .2rem; }
    #catBtns, #subCatBtns { gap: 6px !important; }

    /* --- 子分類區域 --- */
    #subCatBtnsContainer {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);
    }

    /* --- 風格主題 (保留舊版三個主題) --- */
    /* ☕ 古典咖啡 */
    body.theme-coffee { background: linear-gradient(to bottom, #4e342e, #2d1a16); color: #fbe9e7; }
    .theme-coffee .header-banner { background: rgba(0, 0, 0, 0.4); border-bottom: 2px solid #d4af37; }
    .theme-coffee .btn-active-gold { background-color: #d4af37 !important; color: #000 !important; border-color: #d4af37 !important; }
    .theme-coffee .book-card-inner::after { background: #1a0f0d; color: #fbe9e7; border: 1px solid #d4af37; }

    /* 🛰️ 未來科技 */
    body.theme-tech { background: radial-gradient(circle at center, #0a192f 0%, #020c1b 100%); color: #64ffda; }
    .theme-tech .header-banner { background: rgba(2, 12, 27, 0.8); border-bottom: 2px solid #64ffda; box-shadow: 0 0 15px #64ffda; }
    .theme-tech .btn-active-gold { background-color: #64ffda !important; color: #020c1b !important; border-color: #64ffda !important; box-shadow: 0 0 10px #64ffda; }
    .theme-tech .book-card-inner { background: #112240; border: 1px solid #64ffda; color: #64ffda; }
    .theme-tech .book-title { color: #64ffda; }
    .theme-tech .book-card-inner::after { background: #0a192f; color: #64ffda; border: 1px solid #64ffda; }

    /* 🦾 賽博龐克 */
    body.theme-cyber { background: #0d0221 !important; color: #f7eb0a; }
    .theme-cyber .header-banner { background: #0d0221 !important; border-bottom: 4px solid #ff00ff; box-shadow: 0 0 20px #ff00ff; }
    .theme-cyber .btn-active-gold { background-color: #f7eb0a !important; color: #0d0221 !important; border-color: #ff00ff !important; box-shadow: 0 0 15px #f7eb0a; }
    .theme-cyber .book-card-inner { background: #0d0221; border: 2px solid #ff00ff; color: #f7eb0a; box-shadow: 5px 5px 0px #f7eb0a; }
    .theme-cyber .book-title { color: #f7eb0a; }
    .theme-cyber .book-card-inner::after { background: #0d0221; color: #f7eb0a; border: 1px solid #ff00ff; box-shadow: 0 0 10px #ff00ff; }

    #loadMoreContainer { margin-top: 40px; }
  </style>
</head>
<body class="theme-coffee">
  <div class="container header-banner text-center">
    <div class="text-end mb-2">
      <button class="btn btn-sm btn-outline-light" onclick="cycleTheme()" id="themeBtn">🌓 模式切換</button>
    </div>
    <h2 id="mainTitle" class="m-0">📚 Liang的私人典藏書櫃</h2>
    <div id="counterInfo" class="mt-2 fw-bold">從雲端搬書中...</div>
    <div class="mt-3 mx-auto" style="max-width: 500px;">
      <input type="text" id="searchInput" class="form-control" placeholder="搜尋書名關鍵字..." onkeyup="resetPaginationAndFilter()">
    </div>
    <div id="btnGroup" class="mt-3 d-flex flex-wrap justify-content-center gap-2">
      <button id="btnAll" class="btn btn-sm btn-outline-warning active btn-mode" onclick="changeMode('all')">全部典藏</button>
      <button id="btnLatest" class="btn btn-sm btn-outline-info btn-mode" onclick="changeMode('latest')">✨ 最新上架 (50)</button>
      <button id="btnRandom" class="btn btn-sm btn-outline-danger btn-mode" onclick="changeMode('random')">🎲 隨機推薦</button>
      
      <div id="catBtns" class="d-flex flex-wrap justify-content-center w-100 mt-2"></div>
      
      <div id="subCatBtnsContainer" class="w-100 d-none">
        <div class="text-secondary small mb-1">子分類篩選：</div>
        <div id="subCatBtns" class="d-flex flex-wrap justify-content-center"></div>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="shelf" class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-5 row-cols-xl-6 g-4">
      <div id="loader" class="text-center w-100 mt-5"><div class="spinner-border text-warning"></div><p class="mt-2">正在點收檔案...</p></div>
    </div>
    <div id="loadMoreContainer" class="text-center d-none">
      <button id="btnLoadMore" class="btn btn-outline-light rounded-pill px-5" onclick="loadMore()">載入更多書籍</button>
      <p class="mt-3 text-secondary small" id="pageInfo"></p>
    </div>
  </div>

  <script>
    // --- 主題切換邏輯 (沿用) ---
    const themes = ['theme-coffee', 'theme-tech', 'theme-cyber'];
    const names = ['☕ 古典咖啡', '🛰️ 未來科技', '🦾 賽博龐克'];

    function cycleTheme() {
      const b = document.body;
      const currentClass = b.className.split(' ')[0];
      let idx = themes.indexOf(currentClass);
      if (idx === -1) idx = 0;
      const nextIdx = (idx + 1) % themes.length;
      b.className = themes[nextIdx];
      document.getElementById('themeBtn').innerText = '🌓 ' + names[nextIdx].split(' ')[names[nextIdx].split(' ').length-1];
      localStorage.setItem('liang-ebook-theme-v2', themes[nextIdx]);
    }

    (function initTheme() {
      const saved = localStorage.getItem('liang-ebook-theme-v2') || 'theme-coffee';
      document.body.className = saved;
      const idx = themes.indexOf(saved) !== -1 ? themes.indexOf(saved) : 0;
      document.getElementById('themeBtn').innerText = '🌓 ' + names[idx].split(' ')[names[idx].split(' ').length-1];
    })();

    // --- 核心資料處理與篩選邏輯 (重大重構) ---
    let allData = [], filteredData = [], displayData = [];
    let parentSubMap = {}; // 儲存 主分類 -> [子分類陣列] 的映射表
    const pageSize = 60;
    
    // 篩選狀態變數
    let currentPage = 1;
    let currentMode = 'all'; // all, latest, random, cat
    let currentMainCat = ''; // 當前選取的主分類
    let currentSubCat = '';  // 當前選取的子分類

    // 初始化：呼叫後端 GAS 取得資料
    google.script.run.withSuccessHandler(function(jsonString) {
      try {
        allData = JSON.parse(jsonString);
      } catch (e) {
        console.error("資料解析失敗", e);
        document.getElementById('loader').innerHTML = `<h4 class="text-danger">資料格式錯誤</h4>`;
        return;
      }

      if (!allData || allData.length === 0) {
        document.getElementById('loader').innerHTML = '<h4>📚 書櫃目前是空的，請先在試算表點擊「同步雲端檔案」。</h4>';
        return;
      }

      // 產生分類映射表與主分類按鈕
      generateCatMap();
      renderMainCatFilters();
      
      // 預設顯示全部
      changeMode('all');
    }).getBookData();

    // 分析資料，建立分類對照表
    function generateCatMap() {
      allData.forEach(book => {
        if (!parentSubMap[book.mainCat]) {
          parentSubMap[book.mainCat] = new Set();
        }
        parentSubMap[book.mainCat].add(book.subCat);
      });
      // 將 Set 轉回陣列並排序
      for (let p in parentSubMap) {
        parentSubMap[p] = Array.from(parentSubMap[p]).sort();
      }
    }

    // 渲染主分類按鈕
    function renderMainCatFilters() {
      // 取得所有主分類，排序
      const mainCats = Object.keys(parentSubMap).sort();
      const container = document.getElementById('catBtns');
      container.innerHTML = '';
      
      mainCats.forEach(cat => {
        const btn = document.createElement('button');
        btn.className = 'btn btn-xs btn-outline-light btn-main-cat';
        btn.textContent = cat;
        btn.dataset.val = cat; 
        // 點擊主分類：切換模式，並傳入主分類名稱
        btn.onclick = function() { changeMode('cat', this.dataset.val); };
        container.appendChild(btn);
      });
    }

    // 渲染子分類按鈕列 (當主分類被選取時呼叫)
    function renderSubCatFilters(mainCat) {
      const subs = parentSubMap[mainCat] || [];
      const subContainer = document.getElementById('subCatBtns');
      const subArea = document.getElementById('subCatBtnsContainer');
      
      subContainer.innerHTML = '';
      currentSubCat = ''; // 重設子分類篩選

      if (subs.length === 0 || (subs.length === 1 && subs[0] === '無子分類')) {
        subArea.classList.add('d-none'); // 沒有有效子分類，隱藏該區域
        return;
      }

      subArea.classList.remove('d-none'); // 顯示子分類區域

      // 加入「全部子分類」按鈕
      const btnAllSub = document.createElement('button');
      btnAllSub.className = 'btn btn-xs btn-outline-secondary btn-sub-cat active';
      btnAllSub.textContent = "全部" + mainCat;
      btnAllSub.onclick = function() { selectSubCat('', this); };
      subContainer.appendChild(btnAllSub);

      subs.forEach(sub => {
        if (sub === '無子分類') return;
        const btn = document.createElement('button');
        btn.className = 'btn btn-xs btn-outline-light btn-sub-cat';
        btn.textContent = sub;
        btn.dataset.val = sub;
        btn.onclick = function() { selectSubCat(this.dataset.val, this); };
        subContainer.appendChild(btn);
      });
    }

    // 點擊子分類按鈕的操作
    function selectSubCat(subCat, btnEl) {
      currentSubCat = subCat;
      currentPage = 1;
      
      // 更新子分類按鈕 UI 狀態
      document.querySelectorAll('.btn-sub-cat').forEach(b => b.classList.remove('active', 'btn-active-gold', 'btn-outline-secondary'));
      document.querySelectorAll('.btn-sub-cat').forEach(b => b.classList.add('btn-outline-light'));
      
      btnEl.classList.remove('btn-outline-light');
      btnEl.classList.add('active', 'btn-active-gold');

      applyFilterAndRender();
    }

    /**
     * 切換主篩選模式
     * mode: all, latest, random, cat
     * val: 當 mode 為 cat 時，val 為主分類名稱
     */
    function changeMode(mode, val) {
      currentMode = mode;
      currentPage = 1;
      currentSubCat = ''; // 切換模式時重設子分類
      
      const t = document.getElementById('mainTitle');
      const subArea = document.getElementById('subCatBtnsContainer');
      
      // 更新 UI 與標題
      if (mode === 'all') {
        t.innerText = '📚 私人典藏書櫃 v2.0';
        subArea.classList.add('d-none');
        currentMainCat = '';
      } else if (mode === 'latest') {
        t.innerText = '✨ 最新上架 (50本)';
        subArea.classList.add('d-none');
        currentMainCat = '';
      } else if (mode === 'random') {
        t.innerText = '🎲 隨機推薦';
        subArea.classList.add('d-none');
        currentMainCat = '';
      } else if (mode === 'cat') {
        t.innerText = '📂 ' + val;
        currentMainCat = val;
        // 動態產生子分類按鈕
        renderSubCatFilters(val);
      }
      
      updateButtonActiveState(mode, val); 
      applyFilterAndRender();
    }

    // 搜尋框輸入時重設頁碼並篩選
    function resetPaginationAndFilter() { 
      // 搜尋時不影響當前的分類篩選狀態，只疊加關鍵字搜尋
      currentPage = 1; 
      applyFilterAndRender();
    }

    // 核心篩選與渲染執行函式
    function applyFilterAndRender() {
      const term = document.getElementById('searchInput').value.toLowerCase().trim();
      
      // 1. 處理特殊模式 (最新、隨機)
      if (currentMode === 'latest') {
        filteredData = allData.slice(0, 50);
      } else if (currentMode === 'random') {
        filteredData = [allData[Math.floor(Math.random() * allData.length)]];
      } 
      // 2. 處理標準篩選 (全部 或 分類) + 搜尋關鍵字
      else {
        filteredData = allData.filter(book => {
          // 搜尋條件：書名包含關鍵字
          const matchSearch = term === '' || book.title.toLowerCase().includes(term);
          
          // 分類條件：
          let matchCategory = false;
          if (currentMode === 'all') {
            matchCategory = true; // 全部模式
          } else if (currentMode === 'cat') {
            // 分類模式：主分類必須匹配
            if (book.mainCat === currentMainCat) {
              // 如果選取了子分類，子分類也必須匹配
              if (currentSubCat === '' || book.subCat === currentSubCat) {
                matchCategory = true;
              }
            }
          }
          
          return matchSearch && matchCategory;
        });
      }

      // 分頁切片
      displayData = filteredData.slice(0, currentPage * pageSize);
      
      // 渲染書本卡片
      renderBooks(displayData);
      
      // 更新計數器與分頁 UI
      updatePaginationUI(filteredData.length, displayData.length);
    }

    // 加載更多
    function loadMore() { currentPage++; applyFilterAndRender(); }

    // 更新分頁計數與按鈕
    function updatePaginationUI(total, current) {
      document.getElementById('counterInfo').innerText = `典藏總數：${total} | 已載入：${current}`;
      const container = document.getElementById('loadMoreContainer');
      
      // 隨機與最新模式不顯示「加載更多」
      const shouldShowLoadMore = current < total && currentMode !== 'latest' && currentMode !== 'random';
      
      if (shouldShowLoadMore) {
        container.classList.remove('d-none');
        document.getElementById('pageInfo').innerText = `顯示中：${current} / ${total}`;
      } else {
        container.classList.add('d-none');
      }
    }

    // 更新按鈕的 Active 狀態 (配合主題變色)
    function updateButtonActiveState(mode, val) {
      // 移除所有模式與主分類按鈕的 active
      document.querySelectorAll('.btn-mode, .btn-main-cat').forEach(b => b.classList.remove('active', 'btn-active-gold'));

      if (mode === 'all') document.getElementById('btnAll').classList.add('active', 'btn-active-gold');
      else if (mode === 'latest') document.getElementById('btnLatest').classList.add('active', 'btn-active-gold');
      else if (mode === 'random') document.getElementById('btnRandom').classList.add('active', 'btn-active-gold');
      else if (mode === 'cat') {
        // 尋找對應的主分類按鈕
        const target = Array.from(document.querySelectorAll('.btn-main-cat')).find(b => b.dataset.val === val);
        if(target) target.classList.add('active', 'btn-active-gold');
      }
    }

    // 渲染書籍卡片 HTML (沿用舊版設計)
    function renderBooks(books) {
      const shelf = document.getElementById('shelf');
      
      // 如果是第一頁，清空書架；否則保留（用於加載更多）
      if (currentPage === 1) {
        shelf.innerHTML = '';
      } else {
        // 加載更多時，只移除原本的卡片，不移除 loader (如果有的話)
        document.querySelectorAll('#shelf .book-col').forEach(e => e.remove());
      }
      
      const loader = document.getElementById('loader');
      if(loader) loader.remove();

      if (books.length === 0) {
        shelf.innerHTML = '<div class="text-center w-100 mt-5 text-secondary">找不到符合條件的書籍。</div>';
        return;
      }

      const frag = document.createDocumentFragment();
      
      books.forEach(b => {
        const col = document.createElement('div'); 
        col.className = 'col book-col'; // 加上 book-col 方便加載更多時識別
        
        const card = document.createElement('div'); 
        card.className = 'card book-card-inner';
        card.setAttribute('data-title', b.title); // 用於 Tooltip
        
        // 點擊開啟 Drive 預覽頁面
        card.onclick = function() { 
          window.open('https://drive.google.com/file/d/' + b.pdfId + '/view'); 
        };
        
        // 處理封面圖片，若無圖片則使用 Placeholder
        const imgUrl = b.imgId ? 'https://drive.google.com/thumbnail?id=' + b.imgId + '&sz=w400' : 'https://via.placeholder.com/250x350?text=No+Cover';
        
        card.innerHTML = `
          <div class="img-container">
            <img src="${imgUrl}" class="cover-img" loading="lazy" alt="cover">
          </div>
          <div class="card-body p-0">
            <div class="book-title"></div>
          </div>
        `;
        // 使用 textContent 封裝書名，防止 XSS
        card.querySelector('.book-title').textContent = b.title; 
        
        col.appendChild(card);
        frag.appendChild(col);
      });
      
      shelf.appendChild(frag);
    }
  </script>
</body>
</html>
