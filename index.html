<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Liang 的書視界</title>
  <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3145/3145765.png">  
  <style>
    /* 強制讓 GitHub 頁面本身不產生任何邊距或捲軸 */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden; /* 關鍵：隱藏外層捲軸，只讓書櫃內部捲動 */
      background-color: #2d1a16; /* 使用與書櫃一致的暗褐色 [cite: 19] */
    }

    /* 讓 iframe 變成絕對定位，100% 填滿整個螢幕 */
    #book-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <iframe 
    id="book-frame"
    src="https://script.google.com/macros/s/AKfycbzTHauBO1ZQCbzi5JvF1qAENFCrk79RyftsdYAQnGJINVv4OhCWpS8JFE8Z4g8tgydt/exec?v=1"
    allowfullscreen>
  </iframe>
</body>
</html>
